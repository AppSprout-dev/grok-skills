name: bootstrap-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.0 if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: AppSprout-dev/grok-skills
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi
          gh release create v1.0.0 \
            --title "v1.0.0" \
            --target main \
            --notes "First public release of the AppSprout Grok Build marketplace.

Plugins:
- cem-design-process
- greenfield-research-platform

Process skills only. Pin installs to this tag when you need a frozen SHA."
